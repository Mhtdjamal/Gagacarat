<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf7f0;--card:#fff;--tx:#2b2412;--mu:#7a6f55;--ac:#b8860b;--bd:#e6dcc0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140c;--card:#241f12;--tx:#f3ead2;--mu:#a99d7c;--ac:#e0b43a;--bd:#3b331c}}
:root[data-theme="dark"]{--bg:#17140c;--card:#241f12;--tx:#f3ead2;--mu:#a99d7c;--ac:#e0b43a;--bd:#3b331c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;max-width:520px;margin-inline:auto}
h1{font-size:22px;margin:4px 0 14px;color:var(--ac);display:flex;align-items:center;gap:6px}
.by{margin-left:auto;text-align:right;font-size:12px;font-weight:500;line-height:1.25;color:var(--mu)}
.by b{color:var(--ac);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 4px}
input{width:100%;font-size:18px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);min-width:0}
button{width:100%;margin-top:14px;padding:13px;font-size:17px;font-weight:600;border:0;border-radius:10px;background:var(--ac);color:#1a1405}
.row{display:grid;grid-template-columns:26px 1fr 1fr 40px;gap:6px;align-items:center;margin-bottom:6px}
.hd{font-size:12px;color:var(--mu);margin:10px 0 4px}
.no{font-size:13px;color:var(--mu)}
.rs{grid-column:2 / 4;font-size:14px;color:var(--mu);margin:-2px 0 6px}
.rs b{color:var(--ac);font-size:16px}
.rs:empty{display:none}
button.x{width:auto;margin:0;padding:8px 0;background:none;color:var(--mu);border:1px solid var(--bd);font-size:18px}
button.sec{background:none;color:var(--ac);border:1px dashed var(--ac);margin-top:8px}
.big{font-size:44px;font-weight:700;color:var(--ac);text-align:center;margin:4px 0}
.sub{text-align:center;color:var(--mu);font-size:13px}
.dk{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:14px;margin:10px 0 4px}
.dk input{width:auto;padding:0;margin:0}
.foot{text-align:center;color:var(--mu);font-size:13px;margin:18px 0 8px}
.foot b{color:var(--ac)}
.rec{border-top:1px solid var(--bd);padding:10px 0}
.rec:first-child{border-top:0}
.rt{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.rt span,.rm{color:var(--mu);font-size:13px}
.rm b{color:var(--ac)}
.rb{display:flex;gap:8px}
.rb button{margin-top:8px;padding:8px;font-size:14px}
.rb .x2{background:none;color:var(--mu);border:1px solid var(--bd)}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:500;font-size:13px}
.lnk{background:none;color:var(--mu);font-size:13px;margin-top:8px;padding:6px;text-decoration:underline}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<h1>⚖️ <span>Calcul carat d’or</span><span class="by">Créée par<br><b>Mht Djamal</b></span></h1>

<div class="card">
  <label for="n">Saisissez le nom du propriétaire de colis</label>
  <input id="n" type="text" placeholder="Ex. : M-DO" autocomplete="off">
  <label for="op">Nom de la personne qui fait le rapport</label>
  <input id="op" type="text" placeholder="Ex. : votre nom" autocomplete="off">
  <div class="row hd"><span></span><span>Poids de l’or (g)</span><span>Poids de l’eau (cm³)</span><span></span></div>
  <div id="rows"></div>
  <button class="sec" id="add" type="button">+ Ajouter un lingot</button>
  <button id="go" type="button">Résultat final du carat</button>
  <button class="sec" id="newf" type="button">Nouvelle facture</button>
</div>

<div class="card" id="res" hidden>
  <div class="sub">Carat affiché à l’écran</div>
  <div class="big" id="out"></div>
  <label class="dk"><input type="checkbox" id="dk" checked> 🌙 Facture bleu nuit (mode nuit)</label>
  <button id="pdf" type="button" style="margin:6px 0 14px">📄 Enregistrer / envoyer en PDF</button>
  <button id="img" type="button" style="margin:0 0 14px">🖼️ Enregistrer dans l’album photo</button>
  <button id="tkt" type="button" style="margin:0 0 14px">🧾 Ticket pour imprimante</button>
  <div class="sub" id="saved" style="margin:-6px 0 12px;color:var(--ac)"></div>
  <div class="wrap"><table><thead><tr><th>N°</th><th>Or</th><th>Eau</th><th>Dens.</th><th>Carat</th></tr></thead><tbody id="det"></tbody></table></div>
  <div style="height:14px"></div>
  <div class="wrap"><table>
    <thead><tr><th>Étape</th><th>Résultat</th></tr></thead>
    <tbody id="steps"></tbody>
  </table></div>
</div>

<div class="card">
  <div class="sub" style="text-align:left;margin-bottom:6px">Tableau des calculs</div>
  <div class="wrap"><table>
    <thead><tr><th>Or</th><th>Eau</th><th>Densité</th><th>Carat</th></tr></thead>
    <tbody id="hist"></tbody>
  </table></div>
  <button class="lnk" id="clr" type="button">Effacer le tableau</button>
</div>

<div class="card">
  <div class="sub" style="text-align:left;margin-bottom:6px">Factures enregistrées</div>
  <div class="sub" id="where" style="text-align:left;margin:-2px 0 8px"></div>
  <div id="recs"></div>
</div>

<script>
const C1=10.51,K=52.838,FF='Helvetica, Arial, sans-serif';
const tr=(x,d)=>{const p=10**d;return Math.trunc(x*p+(x>=0?1e-7:-1e-7))/p};
const fr=(x,d)=>x.toFixed(d).replace('.',',');
const num=s=>parseFloat(String(s).trim().replace(',','.'));
const $=id=>document.getElementById(id);
const calcOne=(a,b)=>{const d3=tr(a/b,3),d=tr(d3,2),e=tr(d3-C1,3),f=tr(e*K,4),g=d>0?tr(f/d,3):0;return{d3,d,e,f,g,c:tr(g,2)}};
function rowShow(r){curId=null;
  $('res').hidden=true;
  const a=num(r.querySelector('.g').value),b=num(r.querySelector('.e').value),o=r.querySelector('.rs');
  if(isNaN(a)||!(b>0)){o.textContent='';return}
  const t=calcOne(a,b);o.innerHTML='Densité '+fr(t.d,2)+' · Carat <b>'+fr(t.c,2)+'</b>';
}
let hist=[],last=null,curId=null,recs=[];
try{recs=JSON.parse(localStorage.getItem('carat_recs')||'[]')}catch(e){recs=[]}

function storeLocal(L,nom,op){
  const rec={id:L.id,nom,op,ing:L.ing.map(t=>({a:t.a,b:t.b,d:t.d,c:t.c})),A:L.A,B:L.B,d:L.d,c:L.c};

function renum(){document.querySelectorAll('#rows .row').forEach((r,i)=>r.querySelector('.no').textContent=i+1)}
function addRow(){
  const r=document.createElement('div');r.className='row';
  r.innerHTML='<span class="no"></span><input class="g" inputmode="decimal" placeholder="0,00"><input class="e" inputmode="decimal" placeholder="0,00"><button class="x" type="button" aria-label="Supprimer">×</button><div class="rs"></div>';
  r.querySelector('.x').onclick=()=>{if(document.querySelectorAll('#rows .row').length>1){r.remove();renum();$('res').hidden=true}};

function calc(){
  const ing=[];let bad=0;
  document.querySelectorAll('#rows .row').forEach((r,i)=>{
    const a=num(r.querySelector('.g').value),b=num(r.querySelector('.e').value);
    if(isNaN(a)&&isNaN(b))return;
    if(isNaN(a)||isNaN(b)){if(!bad)bad=i+1;return}
    if(!(b>0)){if(!bad)bad=i+1;return}
    ing.push({a,b});
  });
  if(bad){alert('Complétez le poids d’or et le poids d’eau du lingot '+bad+'.');return}
  if(!ing.length)return;
  const A=Number(ing.reduce((s,t)=>s+t.a,0).toFixed(4)),B=Number(ing.reduce((s,t)=>s+t.b,0).toFixed(4));
  if(!(B>0))return;
  const {d3,d,e,f,g,c}=calcOne(A,B);ing.forEach(t=>Object.assign(t,calcOne(t.a,t.b)));
  if(!(d>0))return;
  const n=ing.length;
  last={ing,A,B,d3,d,e,f,g,c,id:curId||Date.now()};curId=last.id;$('saved').textContent='';
  $('res').hidden=false;$('out').textContent=fr(c,2);
  $('det').innerHTML=ing.map((t,k)=>`<tr><td>${k+1}</td><td>${fr(t.a,2)}</td><td>${fr(t.b,2)}</td><td>${fr(t.d,2)}</td><td><b>${fr(t.c,2)}</b></td></tr>`).join('')+`<tr><td>Σ</td><td><b>${fr(A,2)}</b></td><td><b>${fr(B,2)}</b></td><td><b>${fr(d,2)}</b></td><td><b>${fr(c,2)}</b></td></tr>`;
  $('steps').innerHTML=[
    ['Total or ('+n+' lingot'+(n>1?'s':'')+')',fr(A,2)],
    ['Total eau',fr(B,2)],
    ['Densité : or ÷ eau',fr(d3,3)],
    ['− '+fr(C1,2),fr(e,3)],
    ['× '+fr(K,3),fr(f,4)],
    ['÷ densité '+fr(d,2),fr(g,3)],
    ['Affiché',fr(c,2)]
  ].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
  hist.unshift({a:A,b:B,d,c});hist=hist.slice(0,30);save();drawHist();
}
function showDeliver(blob,filename,type){
  const old=document.getElementById('dlv');if(old)old.remove();
  const url=URL.createObjectURL(blob),isImg=type.indexOf('image')===0,fn=esc(filename);
  const o=document.createElement('div');o.id='dlv';
  o.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.88);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 28px;color:#fff;font-family:system-ui,sans-serif;text-align:center';
  const bs='display:block;width:100%;margin:10px 0 0;padding:13px;font-size:17px;font-weight:600;border:0;border-radius:10px;background:#b8860b;color:#1a1405;box-sizing:border-box';
  o.innerHTML='<div style="max-width:480px;margin:0 auto"><div style="font-size:20px;font-weight:700;margin-bottom:8px">Facture prête ✓</div>'+
    (isImg?'<img src="'+url+'" style="max-width:100%;border-radius:8px;background:#fff"><div style="font-size:13px;margin-top:8px;opacity:.85">Appuyez longuement sur l’image, puis choisissez « Enregistrer dans Photos » (ou « Ajouter aux Photos »), ou utilisez le bouton ci-dessous.</div>'
          :'<div style="font-size:14px;opacity:.85;margin:6px 0 4px">'+fn+'</div><a href="'+url+'" target="_blank" style="'+bs+';text-decoration:none">📄 Ouvrir le PDF</a>')+
    '<button id="dlv-share" type="button" style="'+bs+'">'+(isImg?'📷 Enregistrer dans Photos':'📤 Partager / Enregistrer')+'</button>'+
    (isImg?'':'<a href="'+url+'" download="'+fn+'" style="'+bs+';background:#444;color:#fff;text-decoration:none">⬇️ Télécharger le fichier</a>')+
    '<button id="dlv-x" type="button" style="'+bs+';background:none;border:1px solid #888;color:#fff">Fermer</button></div>';
  document.body.appendChild(o);
  document.getElementById('dlv-x').onclick=()=>o.remove();
  document.getElementById('dlv-share').onclick=async()=>{
    try{
      const f=new File([blob],filename,{type});
      if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:filename});
      else alert('Le partage n’est pas disponible ici. Utilisez « Télécharger le fichier ».');
    }catch(e){if(!e||e.name!=='AbortError')alert('Partage impossible : '+(e&&e.message?e.message:e))}
  };
}
function dataBlob(u){const b=atob(u.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:'image/png'})}
async function saveFile(blob,filename,type){
  const f=new File([blob],filename,{type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f],title:filename});return}
    catch(e){if(e&&e.name==='AbortError')throw {code:'declined'}}
  }
  showDeliver(blob,filename,type);
}

}
const hx=a=>'#'+a.map(v=>v.toString(16).padStart(2,'0')).join('');
function drawIngotC(g,x,y,w,h){
  const P=a=>a.map(q=>[x+q[0]*w,y+q[1]*h]);
  const poly=(a,col)=>{const p=P(a);g.fillStyle=col;g.beginPath();g.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)g.lineTo(p[i][0],p[i][1]);g.closePath();g.fill();g.stroke()};
  g.save();g.lineJoin='round';g.lineWidth=3;g.strokeStyle='#8a6508';
  poly([[.20,0],[.80,0],[.94,.38],[.06,.38]],'#f7de8a');
  poly([[.06,.38],[.94,.38],[1,1],[0,1]],'#d9aa2e');
  poly([[0,.86],[1,.86],[1,1],[0,1]],'#b98a12');
  poly([[.30,.07],[.62,.07],[.68,.17],[.24,.17]],'#fff3c4');
  g.fillStyle='#5a3f05';g.textAlign='center';g.textBaseline='middle';
  g.font='bold '+Math.round(h*0.30)+'px '+FF;g.fillText('Au',x+w/2,y+h*0.60);
  g.font='bold '+Math.round(h*0.12)+'px '+FF;g.fillText('999.9',x+w/2,y+h*0.80);
  g.restore();
}
function drawIngotP(doc,x,y,w,h){
  const poly=(a,col)=>{const p=a.map(q=>[x+q[0]*w,y+q[1]*h]);doc.setFillColor(col[0],col[1],col[2]);doc.lines(p.slice(1).map((q,i)=>[q[0]-p[i][0],q[1]-p[i][1]]),p[0][0],p[0][1],[1,1],'FD',true)};
  doc.setDrawColor(138,101,8);doc.setLineWidth(0.4);
  poly([[.20,0],[.80,0],[.94,.38],[.06,.38]],[247,222,138]);
  poly([[.06,.38],[.94,.38],[1,1],[0,1]],[217,170,46]);
  poly([[0,.86],[1,.86],[1,1],[0,1]],[185,138,18]);
  poly([[.30,.07],[.62,.07],[.68,.17],[.24,.17]],[255,243,196]);
  doc.setTextColor(90,63,5);doc.setFont('helvetica','bold');
  doc.setFontSize(10);doc.text('Au',x+w/2,y+h*0.68,{align:'center'});
  doc.setFontSize(5);doc.text('999.9',x+w/2,y+h*0.84,{align:'center'});
  doc.setDrawColor(0,0,0);doc.setLineWidth(0.2);doc.setTextColor(0,0,0);
}
const CO='GAGA CITY';
async function ticketBlob(L,nom,op,co){
  const W=384,n=L.ing.length,rh=38,x0=8,cw=(W-16)/4;
  const cv=document.createElement('canvas');cv.width=W;cv.height=470+n*(rh+2);
  const g=cv.getContext('2d');
  g.fillStyle='#ffffff';g.fillRect(0,0,W,cv.height);
  g.fillStyle='#000000';g.strokeStyle='#000000';g.lineWidth=2;
  let y=14;
  const put=(t,x,yy,px,bold,al)=>{let s=px;g.font=(bold?'bold ':'')+s+'px '+FF;while(g.measureText(t).width>W-16&&s>10){s--;g.font=(bold?'bold ':'')+s+'px '+FF}g.textAlign=al;g.textBaseline='top';g.fillText(t,x,yy)};
  const dash=()=>{g.save();g.setLineDash([6,4]);g.beginPath();g.moveTo(x0,y+4);g.lineTo(W-x0,y+4);g.stroke();g.restore();y+=14};
  if(co){put(co,W/2,y,40,true,'center');y+=50}
  put('Calcul carat d’or',W/2,y,20,false,'center');y+=28;
  put(new Date(L.id).toLocaleString('fr-FR'),W/2,y,16,false,'center');y+=26;
  if(nom){put('Facture de : '+nom,W/2,y,20,true,'center');y+=30}
  dash();
  const row=(vals,h,px,bold)=>{
    for(let i=0;i<4;i++){
      const x=x0+i*cw;g.strokeRect(x,y,cw,h);
      g.font=(bold?'bold ':'')+px+'px '+FF;g.textAlign='center';g.textBaseline='middle';g.fillStyle='#000000';
      g.fillText(vals[i],x+cw/2,y+h/2);
    }
    y+=h;
  };
  row(['Or (g)','Eau (cm³)','Dens.','Carat'],34,13,true);
  if(n>1)L.ing.forEach(t=>row([fr(t.a,2),fr(t.b,2),fr(t.d,2),fr(t.c,2)],rh,19,false));
  row([fr(L.A,2),fr(L.B,2),fr(L.d,2),fr(L.c,2)],48,22,true);
  y+=14;
  put('Nombre : '+n+' lingot'+(n>1?'s':''),x0,y,18,true,'left');y+=28;
  if(op){put('Fait par : '+op,x0,y,18,true,'left');y+=28}
  dash();
  put('Merci',W/2,y,16,false,'center');y+=34;
  const out=document.createElement('canvas');out.width=W;out.height=y;
  const o=out.getContext('2d');o.fillStyle='#ffffff';o.fillRect(0,0,W,y);o.drawImage(cv,0,0);
  return dataBlob(out.toDataURL('image/png'));
}

$('clr').onclick=()=>{hist=[];save();drawHist()};
addRow();drawHist();drawRecs();
try{const v=localStorage.getItem('carat_dk');if(v!==null)$('dk').checked=v==='1'}catch(e){}
$('dk').onchange=()=>{try{localStorage.setItem('carat_dk',$('dk').checked?'1':'0')}catch(e){}};
$('where').textContent='Gardées sur ce téléphone seulement';
$('recs').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.p!==undefined){recPdf(recs[+b.dataset.p]);return}
  if(b.dataset.o!==undefined){openRec(recs[+b.dataset.o]);return}
  if(b.dataset.d!==undefined){if(b.dataset.c){const r=recs[+b.dataset.d];if(dbc&&r){dbc.doc('inv_'+r.id).delete().catch(()=>{})}else{recs.splice(+b.dataset.d,1);saveRecs();drawRecs()}}else{b.dataset.c='1';b.textContent='Confirmer ?'}}};
$('newf').onclick=()=>{curId=null;last=null;$('n').value='';$('rows').innerHTML='';addRow();$('res').hidden=true;window.scrollTo({top:0,behavior:'smooth'})};
try{$('op').value=localStorage.getItem('carat_op')||''}catch(e){}
$('op').oninput=()=>{try{localStorage.setItem('carat_op',$('op').value)}catch(e){}};
</script>
</body>
</html>
